name: "PTT snapshot release"

# Fork-only workflow. Builds the feat/push-to-talk branch on every push
# and updates a single rolling draft release (tag: ptt-snapshot) with
# the latest artifacts, so they don't expire like Actions artifacts do.
# Not intended to be cherry-picked upstream.

on:
  push:
    branches: [feat/push-to-talk]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        submodules: false
    - name: Checkout cinny submodule from fork
      run: |
        git submodule init
        git config submodule.cinny.url https://github.com/lajosbencz/cinny.git
        git submodule update
    - name: Setup node
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version-file: ".node-version"
        package-manager-cache: false
    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
    - name: Install dependencies (ubuntu only)
      if: matrix.platform == 'ubuntu-22.04'
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
    - name: Install cinny dependencies
      run: cd cinny && npm ci
    - name: Install tauri dependencies
      run: npm ci
    - name: Build desktop app with Tauri
      uses: tauri-apps/tauri-action@73fb865345c54760d875b94642314f8c0c894afa # v0.6.1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        NODE_OPTIONS: "--max_old_space_size=4096"
      with:
          args: ${{ matrix.args }} --config '{"bundle":{"createUpdaterArtifacts":false}}'
    - name: Upload macOS artifacts
      if: matrix.platform == 'macos-latest'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: release-artifacts-macos
        path: |
          src-tauri/target/universal-apple-darwin/release/bundle/macos/Cinny*.app
        if-no-files-found: warn
    - name: Upload Linux artifacts
      if: matrix.platform == 'ubuntu-22.04'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: release-artifacts-linux
        path: |
          src-tauri/target/release/bundle/deb/Cinny_*.deb
          src-tauri/target/release/bundle/rpm/Cinny-*.rpm
          src-tauri/target/release/bundle/appimage/Cinny_*.AppImage
        if-no-files-found: warn
    - name: Upload Windows artifacts
      if: matrix.platform == 'windows-latest'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: release-artifacts-windows
        path: |
          src-tauri/target/release/bundle/msi/Cinny_*_x64_*.msi
          src-tauri/target/release/bundle/nsis/Cinny_*_x64-setup.exe
        if-no-files-found: warn

  snapshot-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        submodules: false
    - name: Stage Cargo.lock for release
      run: |
        mkdir -p artifacts
        cp src-tauri/Cargo.lock artifacts/Cargo.lock
    - name: Download all artifacts
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      with:
        pattern: release-artifacts-*
        merge-multiple: true
        path: artifacts
    - name: Update rolling draft release
      uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
      with:
        tag_name: ptt-snapshot
        name: "PTT snapshot"
        draft: true
        prerelease: true
        files: artifacts/**
        body: |
          Rolling snapshot of `feat/push-to-talk`.

          - Commit: ${{ github.sha }}
          - Built: ${{ github.event.head_commit.timestamp }}

          Replaced on every push to the branch.
